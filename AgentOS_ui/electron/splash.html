<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>AgentOS</title>
    <style>
      :root {
        /* matches the app's --accent token (oklch 0.523 0.263 266) */
        --accent: #3b2ff0;
        --ink: #2d2d2d;
        --muted: #7a7a7a;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { height: 100%; overflow: hidden; }
      body {
        font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #ffffff;
        user-select: none;
        -webkit-user-select: none;
      }
      .splash {
        position: relative;
        width: 100vw;
        height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
      }
      .banner {
        position: absolute;
        inset: 0;
        background-image: url("./assets/agentOs.png");
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
      }
      /* soft fade at the bottom so the progress area is always legible */
      .scrim {
        position: absolute;
        left: 0; right: 0; bottom: 0;
        height: 120px;
        background: linear-gradient(to top, rgba(255, 255, 255, 0.95), rgba(255, 255, 255, 0));
      }
      .dock {
        position: relative;
        z-index: 2;
        padding: 0 32px 26px;
      }
      .status-row {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        margin-bottom: 10px;
      }
      .status {
        font-size: 13px;
        font-weight: 500;
        color: var(--ink);
        letter-spacing: 0.1px;
      }
      .percent {
        font-family: "IBM Plex Mono", ui-monospace, monospace;
        font-size: 12px;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }
      .track {
        height: 4px;
        width: 100%;
        border-radius: 999px;
        background: rgba(0, 0, 0, 0.08);
        overflow: hidden;
      }
      .fill {
        height: 100%;
        width: 0%;
        border-radius: 999px;
        background: var(--accent);
        transition: width 0.35s cubic-bezier(0.22, 1, 0.36, 1);
        box-shadow: 0 0 10px rgba(59, 47, 240, 0.35);
      }
    </style>
  </head>
  <body>
    <div class="splash">
      <div class="banner"></div>
      <div class="scrim"></div>
      <div class="dock">
        <div class="status-row">
          <span class="status" id="status">Starting AgentOS…</span>
          <span class="percent" id="percent">0%</span>
        </div>
        <div class="track"><div class="fill" id="fill"></div></div>
      </div>
    </div>

    <script>
      const fillEl = document.getElementById("fill");
      const statusEl = document.getElementById("status");
      const percentEl = document.getElementById("percent");

      let target = 0;   // where the main process wants us
      let shown = 0;    // what we actually render (eased)

      // Smoothly ease toward the target so the bar never jumps or stalls visibly.
      function tick() {
        // creep forward slightly even between milestones so it feels alive
        const ceiling = target < 100 ? Math.min(target + 6, 97) : 100;
        shown += (ceiling - shown) * 0.16;
        if (shown > ceiling) shown = ceiling;
        const val = Math.min(100, Math.round(shown));
        fillEl.style.width = val + "%";
        percentEl.textContent = val + "%";
        requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);

      if (window.splashAPI && window.splashAPI.onProgress) {
        window.splashAPI.onProgress(({ value, label }) => {
          if (typeof value === "number") target = Math.max(target, value);
          if (label) statusEl.textContent = label;
        });
      }
    </script>
  </body>
</html>
